    }
    // 环比洞察
    if(lastExpTotal>0&&expTotal>0){
      const change=((expTotal-lastExpTotal)/lastExpTotal*100).toFixed(0);
      if(change>10)insights.push({icon:'📈',text:'比上个月多花了 '+change+'%，看看是有什么特殊情况',type:'warn'});
      else if(change<-10)insights.push({icon:'📉',text:'比上个月少花了 '+Math.abs(change)+'%，省钱达人',type:'good'});
    }
    // 最多消费日
    const dayTotals={};
    expRecords.forEach(r=>{dayTotals[r.date]=(dayTotals[r.date]||0)+r.amt});
    const topDay=Object.entries(dayTotals).sort((a,b)=>b[1]-a[1])[0];
    if(topDay)insights.push({icon:'📅',text:'花钱最多的一天是 '+topDay[0]+'，花了 ¥'+topDay[1].toFixed(0),type:'info'});

    // ===== 生成建议 =====
    const suggestions=[];

    if(expRecords.length>=10&&cats.size<=2)suggestions.push('消费集中在1-2个分类，试试更多元的消费方式 🎨');
    if(expTotal>0&&incTotal===0)suggestions.push('记得记录收入，收支全貌才能更好分析 💰');

    // ===== Build HTML =====
    const scoreColor=score>=80?'#34c759':score>=60?'#ff9500':'#ff3b30';
    const scoreLabel=score>=80?'理财高手':score>=60?'还不错':'需要加油';

    let html='<div style="text-align:center;padding-bottom:4px">';
    html+='<div style="font-size:12px;color:var(--t2);margin-bottom:4px">本月理财健康报告</div>';
    html+='<svg width="130" height="130" style="display:block;margin:0 auto"><circle cx="65" cy="65" r="55" fill="none" stroke="var(--border)" stroke-width="7"/>';
    html+='<circle cx="65" cy="65" r="55" fill="none" stroke="'+scoreColor+'" stroke-width="7" stroke-dasharray="'+Math.round(score/100*345.6)+' 345.6" stroke-dashoffset="0" transform="rotate(-90 65 65)" stroke-linecap="round" style="transition:stroke-dasharray 1s ease"/>';
    html+='<text x="65" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="var(--text)">'+score+'</text>';
    html+='<text x="65" y="78" text-anchor="middle" font-size="11" fill="var(--t2)">'+scoreLabel+'</text></svg></div>';

    // 核心数据卡片
    html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0">';
    html+='<div style="background:var(--card2);border-radius:10px;padding:10px;text-align:center"><div style="font-size:11px;color:var(--t3)">月支出</div><div style="font-size:18px;font-weight:700;color:var(--red);margin-top:2px" class="tabnum">¥'+expTotal.toFixed(0)+'</div></div>';
    html+='<div style="background:var(--card2);border-radius:10px;padding:10px;text-align:center"><div style="font-size:11px;color:var(--t3)">月收入</div><div style="font-size:18px;font-weight:700;color:var(--green);margin-top:2px" class="tabnum">¥'+incTotal.toFixed(0)+'</div></div>';
    html+='<div style="background:var(--card2);border-radius:10px;padding:10px;text-align:center"><div style="font-size:11px;color:var(--t3)">环比</div><div style="font-size:18px;font-weight:700;color:'+momColor+';margin-top:2px">'+momChange+'</div></div>';
    html+='</div>';

    // 恩格尔系数
    html+='<div style="display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:10px;padding:12px;margin-bottom:8px">';
    html+='<div><div style="font-size:13px;font-weight:600">恩格尔系数</div><div style="font-size:11px;color:var(--t3);margin-top:2px">餐饮支出占比</div></div>';
    html+='<div style="text-align:right"><div style="font-size:20px;font-weight:700" class="tabnum">'+engel+'%</div><div style="font-size:11px;color:var(--t2)">'+engelLevel+'</div></div></div>';

    // 消费排行（Top 3）
    if(sortedCats.length>0){
      html+='<div style="font-weight:600;font-size:13px;margin:8px 0 6px">本月消费排行</div>';
      sortedCats.slice(0,3).forEach(([cat,amt])=>{
        const catData=this.getCatData(cat);
        const pct=(amt/expTotal*100).toFixed(0);
        const barColor=catData.c||'var(--t2)';
        html+='<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px">';
        html+='<span style="font-size:20px;width:28px;text-align:center">'+catData.i+'</span>';
        html+='<div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span>'+catData.n+'</span><span style="color:var(--t2)" class="tabnum">¥'+amt.toFixed(0)+' ('+pct+'%)</span></div>';
        html+='<div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+barColor+';border-radius:2px;transition:width .5s ease"></div></div></div></div>';
      });
    }

    // 智能洞察
    if(insights.length>0){
      html+='<div style="font-weight:600;font-size:13px;margin:12px 0 6px">🔍 智能洞察</div>';
      insights.forEach(ins=>{
        const typeClass=ins.type==='danger'?'danger':ins.type==='warn'?'warn':ins.type==='good'?'good':'info';
        html+='<div class="insight-card '+typeClass+'"><span class="insight-icon">'+ins.icon+'</span><span class="insight-text">'+ins.text+'</span></div>';
      });
    }

    // 建议
    if(suggestions.length>0){
      html+='<div style="font-weight:600;font-size:13px;margin:12px 0 6px">💡 改进建议</div><ul class="ai-suggestions">';
      suggestions.forEach(s=>{html+='<li><span>→</span><span>'+s+'</span></li>'});
      html+='</ul>';
    }

    // 底部
    html+='<div style="text-align:center;font-size:11px;color:var(--t3);margin-top:12px;padding-top:8px;border-top:1px solid var(--border)">基于本月 '+expRecords.length+' 笔支出数据生成<br>数据仅存本地，不上传任何服务器</div>';

    this.showModal(html,'sheet');
  },

  // ===== Time Capsule =====
  getCapsules(){try{return JSON.parse(localStorage.getItem('xzb_capsules')||'[]')}catch(e){return[]}},
  saveCapsules(c){localStorage.setItem('xzb_capsules',JSON.stringify(c))},
  showCapsule(){
    const capsules=this.getCapsules();
    const today=new Date().toISOString().slice(0,10);
    let html='<h3>📮 时间胶囊</h3>';
    html+='<div style="font-size:13px;color:var(--t2);margin-bottom:12px;text-align:center">给未来的自己写一段话，到期后才能打开</div>';
    // 显示已解锁的胶囊
    const unlocked=capsules.filter(c=>c.openDate<=today&&c.opened!==true);
    const locked=capsules.filter(c=>c.openDate>today);
    const toOpen=capsules.filter(c=>c.openDate<=today&&c.opened===true);
    if(unlocked.length>0){
      html+='<div style="font-size:13px;color:var(--green);font-weight:600;margin-bottom:8px">📬 有 '+unlocked.length+' 个胶囊可以打开了！</div>';
      unlocked.forEach(c=>{
        html+='<div class="capsule-item" style="border-left:3px solid var(--green)">';
        html+='<div class="capsule-date">封存于 '+c.createDate+' · 设定解锁 '+c.openDate+'</div>';
        html+='<div class="capsule-msg">"'+this.escapeHtml(c.message)+'"</div>';
        html+='<div class="capsule-summary">'+(c.summary||'')+'</div>';
        html+='<button class="btn-primary" style="margin-top:8px;font-size:14px;padding:10px" onclick="App.openCapsule(\''+c.id+'\')">打开胶囊 ✉️</button>';
        html+='</div>';
      });
    }
    if(locked.length>0){
      html+='<div style="font-size:13px;color:var(--t2);font-weight:600;margin-bottom:8px">🔒 '+locked.length+' 个胶囊等待中...</div>';
      locked.forEach(c=>{
        const daysLeft=Math.ceil((new Date(c.openDate)-new Date(today))/(1000*60*60*24));
        html+='<div class="capsule-item locked">';
        html+='<div class="capsule-date">解锁倒计时：'+daysLeft+' 天</div>';
        html+='<div style="font-size:18px;letter-spacing:4px;color:var(--t3)">🔒 🔒 🔒</div>';
        html+='</div>';
      });
    }
    if(toOpen.length>0){
      html+='<div style="font-size:12px;color:var(--t3);margin-top:8px">已打开 '+toOpen.length+' 个胶囊</div>';
    }
    // 创建新胶囊
    html+='<div class="capsule-create">';
    html+='<textarea id="capsuleMsg" placeholder="写给未来的自己...&#10;比如：希望这时候我已经攒够了旅行基金 ✈️" maxlength="200"></textarea>';
    html+='<select id="capsuleDate"><option value="30">30天后打开</option><option value="90">3个月后打开</option><option value="180">半年后打开</option><option value="365">一年后打开</option></select>';
    html+='<button class="btn-primary" style="font-size:14px;padding:10px;background:linear-gradient(135deg,#6366f1,#a855f7)" onclick="App.createCapsule()">📮 封存这个胶囊</button>';
    html+='</div>';
    this.showModal(html,'sheet');
  },
  createCapsule(){
    const msg=document.getElementById('capsuleMsg').value.trim();
    if(!msg){this.showToast('写点什么给未来的自己吧 ✍️');return}
    const days=parseInt(document.getElementById('capsuleDate').value);
    const today=new Date();
    const openDate=new Date(today.getTime()+days*24*60*60*1000).toISOString().slice(0,10);
    const createDate=today.toISOString().slice(0,10);
    // 生成摘要
    const prefix=createDate.substring(0,7)+'-';
    const monthRecords=this.getRecords().filter(r=>r.date.startsWith(prefix));
    const totalExp=monthRecords.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amt,0);
    const totalInc=monthRecords.filter(r=>r.type==='income').reduce((s,r)=>s+r.amt,0);
    const summary='当月记录：支出 ¥'+totalExp.toFixed(0)+' / 收入 ¥'+totalInc.toFixed(0)+' / 共 '+monthRecords.length+' 笔';
    const capsules=this.getCapsules();
    capsules.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),createDate,openDate,message:msg,summary,opened:false});
    this.saveCapsules(capsules);
    this.showToast('胶囊已封存，'+days+'天后见 📮');
    this.closeModal();
  },
  openCapsule(id){
    const capsules=this.getCapsules();
    const c=capsules.find(x=>x.id===id);
    if(!c)return;
    c.opened=true;
    this.saveCapsules(capsules);
    this.showCapsule();
    setTimeout(()=>this.showToast('来自过去的你的一封信 💌'),500);
  },

  // ===== Consumer Personality =====
  showPersonality(){
    const records=this.getRecords();
    if(records.length<5){this.showToast('多记几笔再来测吧，至少5笔 ✨');return}
    const now=new Date();
    const prefix=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-';
    const monthRecords=records.filter(r=>r.date.startsWith(prefix));
    if(monthRecords.length<3){this.showToast('本月记录太少了，多记几笔再来测 ✨');return}
    // 分析消费模式
    const expRecords=monthRecords.filter(r=>r.type==='expense');
    const totalExp=expRecords.reduce((s,r)=>s+r.amt,0);
    const catTotals={};
    expRecords.forEach(r=>{catTotals[r.cat]=(catTotals[r.cat]||0)+r.amt});
    const topCat=Object.entries(catTotals).sort((a,b)=>b[1]-a[1])[0];
    const topCatData=this.getCatData(topCat[0]);
    // 时间分析
    const nightRecords=expRecords.filter(r=>{const h=parseInt((r.time||'12:00').split(':')[0]);return h>=21||h<6});
    const nightPct=expRecords.length>0?Math.round(nightRecords.length/expRecords.length*100):0;
    // 心情分析
    const happyMood=expRecords.filter(r=>r.mood==='happy').length;
    const sadMood=expRecords.filter(r=>r.mood==='sad').length;
    const totalMood=happyMood+sadMood;
    // 生成人格
    let personality='',desc='',emoji='',color='';
    if(nightPct>=50){personality='🌙 深夜消费星人';desc='你的消费活力在夜幕降临后才真正开始。深夜的外卖、凌晨的网购...建议试试"22点后不打开购物APP"的挑战';emoji='🌙';color='#8b5cf6'}
    else if(topCat&&topCat[0]==='food'&&topCat[1]/totalExp>0.5){personality='🍜 干饭人本干';desc='民以食为天，你是这句话的最佳代言人。餐饮支出占了半壁江山，试试每周做饭3次？';emoji='🍜';color='#ff6b35'}
    else if(topCat&&topCat[0]==='shopping'){personality='🛍️ 快乐购物派';desc='购物让你快乐，这一点数据不会说谎。试试"24小时冷静期"法则？';emoji='🛍️';color='#ff4081'}
    else if(topCat&&topCat[0]==='entertain'){personality='🎬 生活艺术家';desc='你把日子过成了诗，娱乐支出遥遥领先。会享受生活是一种能力';emoji='🎬';color='#9c27b0'}
    else if(sadMood>happyMood&&totalMood>0){personality='💼 理性消费先锋';desc='你对每一笔支出都保持审视，偶尔的后悔说明你在认真对待金钱';emoji='💼';color='#007aff'}
    else if(totalExp===0){personality='💰 存钱小能手';desc='本月零支出记录...等等，你确定不是忘了记？';emoji='💰';color='#34c759'}
    else{personality='🌱 稳健理财新星';desc='你的消费分布比较均衡，没有明显的大头支出。继续保持，未来可期';emoji='🌱';color='#34c759'}
    // 特殊组合标签
    let tags=[];
    if(nightPct>=30)tags.push('夜猫子');
    if(topCat&&topCat[0]==='food')tags.push('美食家');
    if(happyMood>sadMood&&totalMood>3)tags.push('快乐消费');
    if(expRecords.length>=20)tags.push('记账达人');
    if(tags.length===0)tags.push('生活家');
    let html='<div style="text-align:center">';
    html+='<div style="font-size:48px;margin-bottom:8px;animation:bounce .6s var(--spring-bounce)">'+emoji+'</div>';
    html+='<div style="font-size:20px;font-weight:700;color:'+color+';margin-bottom:4px">'+personality+'</div>';
    html+='<div style="display:flex;gap:6px;justify-content:center;margin:8px 0">';
    tags.forEach(t=>{html+='<span style="padding:4px 10px;background:var(--card2);border-radius:12px;font-size:12px;color:var(--t2)">'+t+'</span>'});
    html+='</div>';
    html+='</div>';
    html+='<div style="background:var(--card2);border-radius:12px;padding:14px;margin:12px 0;font-size:13px;color:var(--t2);line-height:1.7">'+desc+'</div>';
    html+='<div style="background:var(--card2);border-radius:12px;padding:14px;font-size:12px;color:var(--t3)">';
    html+='<div style="font-weight:600;color:var(--text);margin-bottom:6px">📊 本月数据概览</div>';
    html+='<div>总支出 ¥'+totalExp.toFixed(0)+' · 最常花在'+topCatData.n+' ('+Math.round(topCat[1]/totalExp*100)+'%)</div>';
    if(nightPct>0)html+='<div>夜间消费占比 '+nightPct+'%'+(nightPct>=30?' 🌙':'')+'</div>';
    html+='<div>共记了 '+monthRecords.length+' 笔账</div>';
    html+='</div>';
    html+='<div style="text-align:center;font-size:11px;color:var(--t3);margin-top:8px">基于本月消费数据生成 · 每月变化 · 纯本地计算</div>';
    this.showModal(html,'sheet');
  },

  // ===== Donate =====
  showDonateModal(){
    const html='<h3>🧋 请我喝杯奶茶吧</h3>'+
      '<div style="text-align:center;color:var(--t2);font-size:13px;line-height:1.8;margin-bottom:14px;padding:14px;background:var(--card2);border-radius:12px">'+
      '嗨，我是 <b style="color:var(--p)">我不要芒果</b><br>'+
      '一个刚高考完、正在过暑假的学生 🎓<br><br>'+
      '碎银记是我一个人写的，<br>'+
      '没有团队，没有公司，只有一台电脑和满腔热情。<br>'+
      '做这件事的初衷很简单——<br>'+
      '市面上的记账APP广告太多、功能太杂，<br>'+
      '我想做一个 <b>真正干净、好用、尊重隐私</b> 的工具。<br><br>'+
      '如果碎银记帮你理清了账目、省下了一笔钱，<br>'+
      '那请我一杯奶茶，就是最好的认可 ☕<br>'+
      '随缘打赏，金额随意，开心就好 💛'+
      '</div>'+
      '<div class="qr-row" style="display:flex;justify-content:center;gap:16px">'+
      '<div style="text-align:center"><img src="qr-wechat.jpg" style="width:120px;height:120px;border-radius:8px;border:1px solid var(--border);object-fit:cover"><div style="font-size:11px;color:var(--t3);margin-top:4px">微信</div></div>'+
      '<div style="text-align:center"><img src="qr-alipay.jpg" style="width:120px;height:120px;border-radius:8px;border:1px solid var(--border);object-fit:cover"><div style="font-size:11px;color:var(--t3);margin-top:4px">支付宝</div></div></div>'+
      '<div style="text-align:center;color:var(--t3);font-size:12px;margin-top:12px">随缘打赏，开心就好 💛</div>';
    this.showModal(html);
  },
};

// ===== Init =====
document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
