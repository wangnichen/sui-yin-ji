<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>碎银记</title>
<style>
/* ===== iOS Spring Animation System ===== */
:root{
  --spring-bounce:cubic-bezier(0.34,1.56,0.64,1);
  --spring-smooth:cubic-bezier(0.25,0.46,0.45,0.94);
  --spring-soft:cubic-bezier(0.16,1,0.3,1);
  --spring-ios:cubic-bezier(0.175,0.885,0.32,1.275);
}
/* ===== CSS Variables ===== */
:root{
  --p:#6366f1;--p2:#8b5cf6;
  --bg:#f5f5f7;--card:#fff;--card2:#f8f8fa;
  --text:#1c1c1e;--t2:#86868b;--t3:#aeaeb2;
  --red:#ff3b30;--green:#34c759;--blue:#007aff;--orange:#ff9500;
  --border:#e5e5ea;--r:14px;--g1:linear-gradient(135deg,#6366f1,#8b5cf6);
  --shadow:0 1px 3px rgba(0,0,0,.06);--safe:env(safe-area-inset-bottom,20px);
}
body.dk{--bg:#121212;--card:#1e1e1e;--card2:#2c2c2c;--text:#e8e8e8;--t2:#a0a0a0;--t3:#666;--border:#3a3a3a;--shadow:0 1px 3px rgba(0,0,0,.4);}

/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
.tabnum{font-variant-numeric:tabular-nums}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden;min-height:100vh;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
input,button,select,textarea{font-family:inherit;font-size:inherit;outline:none;border:none;background:none}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* ===== App Container ===== */
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;padding-bottom:calc(74px + var(--safe));display:flex;flex-direction:column}

/* ===== Top Bar ===== */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;position:sticky;top:0;z-index:100;background:var(--bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:background .3s}
.top-bar .title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.top-bar .actions{display:flex;gap:8px;align-items:center}
.top-bar .btn-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--t2);transition:background .2s}
.top-bar .btn-icon:active{background:var(--card2)}
.top-bar .btn-icon.dk-mode{font-size:20px}
.date-time{font-size:11px;color:var(--t2);font-weight:500;letter-spacing:.5px;opacity:.8}

/* ===== Pages ===== */
.pages{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 16px}
.page{display:none;animation:pageIn .3s var(--spring-soft)}
@keyframes pageIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* ===== Bottom Nav ===== */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:calc(100% - 16px);max-width:464px;background:var(--card);border-top:none;border-radius:16px 16px 0 0;display:flex;padding:6px 0 calc(8px + var(--safe));z-index:100;transition:background .3s,box-shadow .3s;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 -1px 12px rgba(0,0,0,.08)}
body.dk .bottom-nav{box-shadow:0 -1px 12px rgba(0,0,0,.3)}
.bottom-nav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--t2);font-size:11px;transition:color .2s;border:none;background:none;cursor:pointer}
.bottom-nav .nav-item.active{color:var(--p)}
.bottom-nav .nav-item .nav-icon{font-size:22px;line-height:1}
.bottom-nav .nav-item .nav-label{font-weight:500}
.bottom-nav .nav-item.active .nav-icon{animation:bounce .45s var(--spring-bounce)}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-3px)}70%{transform:translateY(1px)}}

/* ===== Cards ===== */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);transition:background .3s,box-shadow .3s;animation:cardIn .4s var(--spring-soft) both}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.card2{background:var(--card2);border-radius:var(--r);padding:14px;margin-bottom:10px;transition:background .3s}
.section-title{font-size:14px;font-weight:600;color:var(--t2);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px;animation:sectionIn .4s var(--spring-soft) both}
@keyframes sectionIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

/* ===== Page 1: Record ===== */
.type-toggle{display:flex;gap:0;background:var(--card2);border-radius:var(--r);padding:3px;margin-bottom:16px}
.type-toggle button{flex:1;padding:10px;border:none;border-radius:calc(var(--r) - 2px);font-size:15px;font-weight:600;background:transparent;color:var(--t2);cursor:pointer;transition:all .3s var(--spring-bounce)}
.type-toggle button.active{background:var(--g1);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.3)}

.budget-reminder{font-size:12px;color:var(--t2);text-align:center;padding:6px 12px;background:var(--card2);border-radius:8px;margin-bottom:8px;animation:fadeIn .3s var(--spring-soft)}
.budget-reminder.warn{color:var(--red);background:rgba(255,59,48,.08)}
.budget-reminder.good{color:var(--green);background:rgba(52,199,89,.08)}
.amount-input-wrap{display:flex;align-items:center;justify-content:center;padding:12px 0;margin-bottom:4px;transition:transform .3s var(--spring-soft)}
.amount-input-wrap:focus-within{transform:scale(1.03)}
.amount-input-wrap .prefix{font-size:40px;font-weight:300;color:var(--t2);margin-right:4px;transition:color .3s}
.amount-input-wrap:focus-within .prefix{color:var(--p)}
.amount-input-wrap input{font-size:40px;font-weight:700;width:200px;text-align:left;color:var(--text);background:transparent;border:none;caret-color:var(--p);outline:none}
.amount-input-wrap input::placeholder{color:var(--t3)}

.quick-amounts{display:flex;gap:8px;margin-bottom:16px}
.quick-amounts button{flex:1;padding:8px 4px;background:var(--card2);border:1px solid var(--border);border-radius:20px;font-size:14px;font-weight:600;color:var(--text);transition:all .2s;font-variant-numeric:tabular-nums}
.quick-amounts button:active{background:var(--p);color:#fff;border-color:var(--p)}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--r);background:var(--card2);transition:all .35s var(--spring-bounce);border:2px solid transparent;cursor:pointer;will-change:transform;animation:catIn .35s var(--spring-soft) both}
.cat-item .cat-emoji{font-size:26px;line-height:1;transition:transform .35s var(--spring-bounce)}
.cat-item:active .cat-emoji,.cat-item.selected .cat-emoji{transform:scale(1.15)}
.cat-item:active,.cat-item.selected{background:var(--card);border-color:var(--p);transform:scale(.95);box-shadow:0 2px 12px rgba(99,102,241,.15)}
@keyframes catIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.cat-item .cat-name{font-size:11px;color:var(--t2);font-weight:500}

.row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.row label{font-size:14px;color:var(--t2);white-space:nowrap;min-width:40px}
.row input[type="date"],.row input[type="text"]{flex:1;padding:10px 12px;background:var(--card2);border-radius:10px;font-size:15px;color:var(--text);border:1px solid var(--border)}
.row input[type="date"]:focus,.row input[type="text"]:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.row input[type="date"]{color-scheme:light}body.dk .row input[type="date"]{color-scheme:dark}
.backfill-bar{display:none;align-items:center;justify-content:space-between;width:100%;padding:8px 12px;background:linear-gradient(135deg,#fff3cd,#ffe0b2);border-radius:10px;margin:10px 0;animation:fadeIn .25s var(--spring-soft)}
body.dk .backfill-bar{background:linear-gradient(135deg,#4a3800,#5c3d00)}
.backfill-label{font-size:12px;color:#856404;font-weight:600}
body.dk .backfill-label{color:#ffc107}
.backfill-btn{font-size:12px;padding:4px 10px;border:none;border-radius:6px;background:rgba(0,0,0,.08);color:#856404;font-weight:600;cursor:pointer;transition:transform .2s var(--spring-bounce)}
body.dk .backfill-btn{background:rgba(255,255,255,.1);color:#ffc107}
.backfill-btn:active{transform:scale(.95)}

.mood-selector{display:flex;gap:8px;margin-bottom:16px}
.mood-selector button{flex:1;padding:10px;border-radius:10px;background:var(--card2);font-size:14px;color:var(--t2);border:2px solid transparent;transition:all .2s}
.mood-selector button.active{border-color:var(--p);color:var(--text);background:var(--card)}


.btn-primary{width:100%;padding:14px;background:var(--g1);color:#fff;border:none;border-radius:var(--r);font-size:17px;font-weight:600;letter-spacing:.5px;transition:transform .4s var(--spring-bounce),opacity .15s,box-shadow .2s;margin-top:4px;will-change:transform;box-shadow:0 4px 14px rgba(99,102,241,.3)}
.btn-primary:active{transform:scale(.96) translateY(1px);opacity:.85;box-shadow:0 1px 4px rgba(99,102,241,.2)}

/* ===== Page 2: Bills ===== */
.search-box{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:10px;padding:8px 14px;margin-bottom:12px;border:1.5px solid var(--border);transition:border-color .3s var(--spring-soft),box-shadow .3s var(--spring-soft)}
.search-box:focus-within{border-color:var(--p);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.search-box input{flex:1;font-size:15px;color:var(--text);background:transparent}
.search-box .search-icon{font-size:16px;color:var(--t3)}

.filter-tags{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-tags::-webkit-scrollbar{display:none}
.filter-tag{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--card2);color:var(--t2);border:1px solid var(--border);transition:all .2s;flex-shrink:0}
.filter-tag.active{background:var(--p);color:#fff;border-color:var(--p)}

.bill-list{display:flex;flex-direction:column;gap:8px}
.bill-item{display:flex;align-items:center;padding:12px;background:var(--card);border-radius:var(--r);gap:12px;transition:transform .3s var(--spring-soft),background .2s;box-shadow:var(--shadow);will-change:transform;animation:billIn .35s var(--spring-soft) both}
.bill-item:active{background:var(--card2);transform:scale(.98)}
@keyframes billIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.bill-item .bill-emoji{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
.bill-item .bill-info{flex:1;min-width:0}
.bill-item .bill-cat{font-size:15px;font-weight:600}
.bill-item .bill-meta{font-size:12px;color:var(--t2);margin-top:2px;display:flex;gap:8px;align-items:center}
.bill-item .bill-amount{font-size:17px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.bill-item .bill-amount.expense{color:var(--red)}
.bill-item .bill-amount.income{color:var(--green)}
.bill-item .bill-actions{display:flex;gap:4px;flex-shrink:0}
.bill-item .bill-actions button{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t2);background:var(--card2);transition:all .2s}
.bill-item .bill-actions button:active{background:var(--border)}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--t3)}
.empty-state .empty-emoji{font-size:56px;margin-bottom:12px}
.empty-state .empty-text{font-size:15px}
.record-count{font-size:12px;color:var(--t3);text-align:center;margin-top:12px}

/* ===== Page 3: Stats ===== */
.insight-card{padding:12px 14px;border-radius:10px;margin-bottom:8px;font-size:13px;display:flex;align-items:flex-start;gap:10px;background:var(--card);border-left:3px solid var(--p);box-shadow:var(--shadow);animation:insightIn .35s var(--spring-soft) both}
.insight-card .insight-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.insight-card .insight-text{color:var(--text);line-height:1.5}
.insight-card.warn{border-left-color:var(--orange)}
.insight-card.danger{border-left-color:var(--red)}
.insight-card.good{border-left-color:var(--green)}
.insight-card.info{border-left-color:var(--blue)}
@keyframes insightIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

.month-compare{text-align:center;padding:8px 0}
.month-compare .mc-amount{font-size:20px;font-weight:700}
.month-compare .mc-pct{font-size:13px;margin-top:2px}
.month-compare .mc-pct.up{color:var(--red)}
.month-compare .mc-pct.down{color:var(--green)}

.chart-wrap{display:flex;justify-content:center;margin:8px 0}
.pie-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:8px 4px 4px;border-top:1px solid var(--border);margin-top:4px}
.pie-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);padding:3px 0}
.pie-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.pie-legend-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pie-legend-pct{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;flex-shrink:0}
.chart-wrap canvas{max-width:100%}

.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calendar-header .cal-title{font-size:15px;font-weight:600}
.calendar-header .cal-nav{display:flex;gap:4px;align-items:center}
.calendar-header .cal-nav button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2);background:var(--card2);transition:all .2s}
.calendar-header .cal-nav button:active{background:var(--border)}
.calendar-weeks{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--t3);margin-bottom:4px;padding:0 2px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendar-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s;position:relative;background:var(--card2);color:var(--t2);gap:1px}
.calendar-cell.today{border:2px solid var(--p);font-weight:700}
.calendar-cell .cal-amt{font-size:8px;margin-top:1px;line-height:1.1;display:flex;flex-direction:column;gap:0}
.cal-amt-exp{color:var(--red);font-variant-numeric:tabular-nums;font-weight:600}
.cal-amt-inc{color:var(--green);font-variant-numeric:tabular-nums;font-weight:600}
.calendar-cell.empty{background:transparent;color:var(--t3);opacity:.4}
.day-detail-modal{max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.day-detail-header{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.day-detail-summary{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:13px;font-weight:600}
.day-detail-list{display:flex;flex-direction:column;gap:2px}
.day-detail-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.day-detail-item:last-child{border-bottom:none}
.day-detail-item:active{background:var(--card2)}
.day-detail-cat{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.day-detail-info{flex:1;min-width:0}
.day-detail-catname{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-detail-amt{font-size:15px;font-weight:700;flex-shrink:0}
.day-detail-edit{font-size:14px;opacity:.4;flex-shrink:0}
.day-detail-backfill{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--orange),#ff9800)}

.ranking-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.ranking-item .rank-emoji{font-size:20px;width:30px;text-align:center}
.ranking-item .rank-name{flex:1;font-weight:500}
.ranking-item .rank-amount{font-weight:600;margin-right:8px}
.ranking-item .rank-bar-wrap{flex:2;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.ranking-item .rank-bar{height:100%;border-radius:3px;transition:width .5s ease}

.tips-box{background:var(--card2);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .2s;margin-top:8px}
.tips-box:active{background:var(--border)}
.tips-box .tips-icon{font-size:20px;flex-shrink:0}
.tips-box .tips-text{font-size:13px;color:var(--text);flex:1}
.tips-box .tips-refresh{font-size:14px;color:var(--t3)}

/* ===== Page 4: Profile ===== */
.profile-card{display:flex;align-items:center;gap:14px;padding:16px}
.profile-card .avatar{width:52px;height:52px;border-radius:50%;background:var(--g1);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;flex-shrink:0}
.profile-card .user-info{flex:1}
.profile-card .user-name{font-size:17px;font-weight:600}
.profile-card .user-email{font-size:13px;color:var(--t2)}
.profile-card .btn-sm{padding:6px 14px;border-radius:16px;font-size:13px;font-weight:500;background:var(--card2);color:var(--text);border:1px solid var(--border);transition:all .2s}
.profile-card .btn-sm:active{background:var(--border)}

.ai-entry{background:var(--g1);border-radius:var(--r);padding:16px;color:#fff;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:12px;transition:opacity .2s}
.ai-entry:active{opacity:.9}
.ai-entry .ai-icon{font-size:28px}
.ai-entry .ai-text{flex:1}
.ai-entry .ai-title{font-size:16px;font-weight:700}
.ai-entry .ai-sub{font-size:12px;opacity:.85}
.ai-entry .ai-arrow{font-size:18px}

.achievements{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ach-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:var(--card2);text-align:center;transition:all .2s}
.ach-item .ach-icon{font-size:24px}
.ach-item .ach-name{font-size:10px;color:var(--t2);line-height:1.2}
.ach-item.locked{opacity:.4}
.ach-item.locked .ach-icon{filter:grayscale(1)}

.goal-item{background:var(--card2);border-radius:var(--r);padding:12px;margin-bottom:8px;position:relative}
.goal-item .goal-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.goal-item .goal-emoji{font-size:20px}
.goal-item .goal-name{font-weight:600;font-size:14px;flex:1}
.goal-item .goal-amount{font-size:12px;color:var(--t2)}
.goal-item .goal-bar-wrap{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-bottom:6px}
.goal-item .goal-bar{height:100%;border-radius:4px;transition:width .5s ease}
.goal-item .goal-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--t3)}
.goal-item .goal-actions{display:flex;gap:6px;margin-top:8px}
.goal-item .goal-actions button{padding:4px 10px;border-radius:12px;font-size:12px;background:var(--bg);color:var(--text);border:1px solid var(--border);transition:all .2s}
.goal-item .goal-actions button:active{background:var(--border)}

.menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s,transform .15s var(--spring-bounce);font-size:15px}
.menu-item:active{background:var(--card2);transform:scale(.98)}
.menu-item:first-of-type{border-radius:var(--r) var(--r) 0 0}
.menu-item:last-of-type{border-radius:0 0 var(--r) var(--r);border-bottom:none}
.menu-item:only-of-type{border-radius:var(--r)}
.menu-item .menu-icon{font-size:20px;width:28px;text-align:center}
.menu-item .menu-text{flex:1}
.menu-item .menu-arrow{color:var(--t3);font-size:14px}
.menu-item .menu-right{color:var(--t2);font-size:13px}

/* Switch */
.switch{position:relative;width:50px;height:30px;border-radius:15px;background:var(--border);transition:background .3s;cursor:pointer;flex-shrink:0}
.switch.on{background:var(--green)}
.dark-opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;cursor:pointer;transition:background .15s}
.dark-opt:active{background:var(--card2)}
.dark-opt.active{background:rgba(99,102,241,.1)}
.dark-opt-icon{font-size:22px;width:32px;text-align:center}
.dark-opt-info{flex:1}
.dark-opt-title{font-size:14px;font-weight:500;color:var(--text)}
.dark-opt-desc{font-size:11px;color:var(--t3);margin-top:2px}
.dark-opt-check{font-size:18px;color:var(--p);opacity:0;transition:opacity .2s}
.dark-opt.active .dark-opt-check{opacity:1}
.dark-time-row{display:flex;align-items:center;gap:8px;padding:0 16px 12px;font-size:13px;color:var(--t2)}
.dark-time-row input{width:60px;padding:6px 8px;background:var(--card2);border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);text-align:center;-webkit-appearance:none}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .3s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.switch.on::after{left:22px}

.author-card{text-align:center;padding:20px;margin-top:8px}
.author-card .author-name{font-size:15px;font-weight:600;color:var(--text)}
.author-card .author-bio{font-size:12px;color:var(--t3);margin-top:2px}
.author-card .author-ver{font-size:11px;color:var(--t3);margin-top:2px}
.capsule-list{display:flex;flex-direction:column;gap:10px}
.capsule-item{background:var(--card2);border-radius:12px;padding:14px;position:relative;overflow:hidden}
.capsule-item.locked{opacity:.7}
.capsule-item.locked::after{content:'';position:absolute;inset:0;background:var(--card);opacity:.5}
.capsule-date{font-size:12px;color:var(--t3);margin-bottom:4px}
.capsule-msg{font-size:14px;color:var(--text);line-height:1.6;margin-bottom:8px;font-style:italic}
.capsule-summary{font-size:12px;color:var(--t2);padding:8px;background:var(--bg);border-radius:8px}
.capsule-create{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.capsule-create textarea{width:100%;min-height:80px;padding:10px 12px;background:var(--card2);border-radius:8px;font-size:14px;color:var(--text);border:1px solid var(--border);resize:vertical;font-family:inherit;line-height:1.6}
.capsule-create textarea:focus{border-color:var(--p);outline:none}
.capsule-create select{padding:10px 12px;background:var(--card2);border-radius:8px;font-size:14px;color:var(--text);border:1px solid var(--border)}
.donate-entry{text-align:center;font-size:13px;color:var(--p);cursor:pointer;padding:8px;margin-top:4px}

/* ===== Toast ===== */
.toast-container{position:fixed;top:60px;left:0;right:0;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;padding:0 20px}
.toast{background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.15);pointer-events:auto;animation:toastIn .35s var(--spring-bounce);display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:100%}
.toast.fade-out{animation:toastOut .3s var(--spring-smooth) forwards}
.toast .toast-undo{color:var(--p);font-weight:600;cursor:pointer;margin-left:4px;background:none;border:none;font-size:14px;padding:0}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-12px) scale(.9)}}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9990;display:none;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.modal-overlay.show{display:flex}
.modal-overlay.sheet{align-items:flex-end}
.modal-overlay.sheet .modal{width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:80vh;overflow-y:auto;animation:slideUp .3s ease}
.modal{background:var(--card);border-radius:var(--r);padding:20px;width:calc(100% - 40px);max-width:400px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:scaleIn .25s ease}
.modal h3{font-size:17px;font-weight:700;margin-bottom:16px;text-align:center}
.modal .modal-close{position:absolute;top:12px;right:16px;font-size:20px;color:var(--t3);cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--card2)}
.modal .modal-close:active{background:var(--border)}
.modal-overlay.closing{animation:fadeOut .25s var(--spring-smooth) forwards}
.modal-overlay.closing.sheet .modal{animation:slideDown .25s var(--spring-smooth) forwards}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes slideDown{from{transform:translateY(0) scale(1)}to{transform:translateY(100%) scale(.95)}}
@keyframes slideUp{from{transform:translateY(100%) scale(.95)}to{transform:translateY(0) scale(1)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.82)}60%{transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
.celebrate-particle{position:fixed;pointer-events:none;z-index:99999;font-size:20px;animation:particleUp 1s ease-out forwards}
@keyframes particleUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(.3) rotate(20deg)}}

// ===== Canvas roundRect Polyfill =====
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number')r={tl:r,tr:r,br:r,bl:r};
    this.beginPath();
    this.moveTo(x+r.tl,y);
    this.lineTo(x+w-r.tr,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r.tr);
    this.lineTo(x+w,y+h-r.br);
    this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
    this.lineTo(x+r.bl,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r.bl);
    this.lineTo(x,y+r.tl);
    this.quadraticCurveTo(x,y,x+r.tl,y);
    this.closePath();
  };
}

  switchPage(page){

  updateDateTime(){
    const el=document.getElementById('dateTime');
    if(!el)return;
    if(this.curPage!=='record'){el.style.display='none';return}
    el.style.display='block';
    const now=new Date();
    const weekdays=['周日','周一','周二','周三','周四','周五','周六'];
    const y=now.getFullYear();
    const m=String(now.getMonth()+1).padStart(2,'0');
    const d=String(now.getDate()).padStart(2,'0');
    const w=weekdays[now.getDay()];
    const hh=String(now.getHours()).padStart(2,'0');
    const mm=String(now.getMinutes()).padStart(2,'0');
    const ss=String(now.getSeconds()).padStart(2,'0');
    el.textContent=y+'年'+m+'月'+d+'日 '+w+' '+hh+':'+mm+':'+ss;
  },

  // ===== Backfill Detection =====
  checkBackfill(){
    const dateEl=document.getElementById('inputDate');
    const bar=document.getElementById('recordBackfillBar');
    const label=document.getElementById('recordBackfillLabel');
    const today=new Date().toISOString().slice(0,10);
    const selected=dateEl.value;
    if(selected&&selected<today){
      const diff=Math.floor((new Date(today)-new Date(selected))/(1000*60*60*24));
      let text='';
      if(diff===1)text='📅 补记昨天的账';
      else if(diff<=7)text='📅 补记 '+diff+' 天前的账';
      else if(diff<=30)text='📅 补记约 '+Math.floor(diff/7)+' 周前的账';
      else text='📅 补记更早的记录';
      label.textContent=text;
      bar.style.display='flex';
    }else{
      bar.style.display='none';
    }
  },
  clearBackfill(){
    const today=new Date().toISOString().slice(0,10);
    document.getElementById('inputDate').value=today;
    document.getElementById('recordBackfillBar').style.display='none';
  },

      s.dark=prefersDark;
      if(prefersDark)document.body.classList.add('dk');else document.body.classList.remove('dk');

    const s=this.getSettings();

    const html='<h3>定时切换设置</h3>'+
      '<div style="text-align:center;padding:8px 0;font-size:13px;color:var(--t2)">设定深色模式的起止时间</div>'+

  saveAutoDark(){
    const from=document.getElementById('darkFrom').value;
    const to=document.getElementById('darkTo').value;
    if(!from||!to){this.showToast('请选择时间');return}
    const s=this.getSettings();
    s.darkMode='auto';
    s.darkAutoFrom=from;
    s.darkAutoTo=to;
    this.saveSettings(s);
    this.applyAutoDark();
    this.updateDarkModeUI();
    this.closeModal();
    this.showToast('已设置定时切换 ⏰');
  },
  applyAutoDark(){
    const s=this.getSettings();
    if(s.darkMode!=='auto')return;
    const now=new Date();
    const h=String(now.getHours()).padStart(2,'0');
    const m=String(now.getMinutes()).padStart(2,'0');
    const current=parseInt(h+m);
    const fromParts=(s.darkAutoFrom||'19:00').split(':');
    const toParts=(s.darkAutoTo||'07:00').split(':');
    const fromTime=parseInt(fromParts[0]+fromParts[1]);
    const toTime=parseInt(toParts[0]+toParts[1]);
    let shouldDark=false;
    if(fromTime>toTime){
      shouldDark=current>=fromTime||current<toTime;
    }else{
      shouldDark=current>=fromTime&&current<toTime;
    }
    if(shouldDark)document.body.classList.add('dk');else document.body.classList.remove('dk');
    s.dark=shouldDark;
    this.saveSettings(s);
    if(this.curPage==='stats')this.renderStats();
  },

  // ===== Toast =====
  showToast(msg,undoLabel,undoFn){
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');
    t.className='toast';
    t.innerHTML='<span>'+msg+'</span>';
    if(undoLabel&&undoFn){
      const b=document.createElement('button');
      b.className='toast-undo';
      b.textContent=undoLabel;
      b.onclick=()=>{undoFn();t.remove();clearTimeout(this.undoTimeout)};
      t.appendChild(b);
    }
    c.appendChild(t);
    // 微关怀：深夜记账问候
    this._microCare(msg);
    setTimeout(()=>{t.classList.add('fade-out');setTimeout(()=>t.remove(),300)},undoLabel?5000:2000);
  },

  _microCare(msg){
    if(msg.indexOf('记好了')===-1&&msg.indexOf('已更新')===-1)return;
    const h=new Date().getHours();
    const today=new Date().toISOString().slice(0,10);
    const todayRecords=this.getRecords().filter(r=>r.date===today);
    // 深夜关怀 (23:00-5:00)
    if(h>=23||h<5){
      setTimeout(()=>{
        const nightMsgs=['这么晚了还在记账，早点休息呀 🌙','夜深了，明天也要好好生活哦 ✨','熬夜记账的你，辛苦了 💜'];
        this.showToast(nightMsgs[Math.floor(Math.random()*nightMsgs.length)]);
      },1200);
    }
    // 每日首笔
    else if(todayRecords.length<=1){
      setTimeout(()=>{
        this.showToast('新的一天，从这一笔开始 ☀️');
      },1200);
    }
  },

  setType(t){
    // Save current amount before switching
    this.savedAmounts[this.curType]=document.getElementById('inputAmount').value||'';
    this.curType=t;
    this.curCat=null;
    this.curMood=null;
    document.querySelectorAll('.type-toggle button').forEach(b=>b.classList.remove('active'));

    // Restore saved amount for the target type

    this.renderMoodSelector();
    this.updateBudgetReminder();

  updateBudgetReminder(){
    const el=document.getElementById('budgetReminder');
    if(!el)return;
    if(this.curType!=='expense'){el.style.display='none';return}
    const budget=this.getSettings().budget;
    if(!budget||budget<=0){el.style.display='none';return}
    const now=new Date();
    const prefix=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-';
    const monthExp=this.getRecords().filter(r=>r.date.startsWith(prefix)&&r.type==='expense').reduce((s,r)=>s+r.amt,0);
    const remaining=budget-monthExp;
    const pct=(monthExp/budget*100).toFixed(0);
    if(remaining>0){
      el.className='budget-reminder good';
      el.textContent='本月预算还剩 ¥'+remaining.toFixed(0)+'（已用 '+pct+'%）';
    }else{
      el.className='budget-reminder warn';
      const overMsgs=['预算超了，但也在好好生活对吧 😊','花了不少，下个月一起加油 💪','超支了没关系，意识到就是进步 ✨'];
      el.textContent='本月已超 ¥'+Math.abs(remaining).toFixed(0)+' · '+overMsgs[Math.floor(Math.random()*overMsgs.length)];
    }
    el.style.display='block';
  },
  renderMoodSelector(){
    const box=document.getElementById('moodSelector');
    if(!box)return;
    const moods=this.curType==='income'?INCOME_MOODS:EXPENSE_MOODS;
    box.innerHTML=moods.map(m=>'<button data-mood="'+m.k+'" onclick="App.setMood(\''+m.k+'\')">'+m.e+' '+m.t+'</button>').join('');
  },
  setMood(m){
    this.curMood=this.curMood===m?null:m;
    const selector=document.getElementById('moodSelector');
    if(!selector)return;
    selector.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    if(this.curMood){
      const btn=selector.querySelector('button[data-mood="'+m+'"]');
      if(btn)btn.classList.add('active');
    }
  },

  renderCatGrid(){

    const c=document.getElementById('catGrid');

      const cat=CATS.find(x=>x.k===k);
      const delay=i*30;
      html+='<div class="cat-item'+(this.curCat===k?' selected':'')+'" style="animation-delay:'+delay+'ms" onclick="App.selectCat(\''+k+'\')"><span class="cat-emoji">'+cat.i+'</span><span class="cat-name">'+cat.n+'</span></div>';
    });
    c.innerHTML=html;
  },
  selectCat(k){
    this.curCat=k;
    document.querySelectorAll('.cat-item').forEach(el=>el.classList.remove('selected'));
    const target=document.querySelector('.cat-item[onclick*="'+k+'"]');
    if(target)target.classList.add('selected');
  },
  getCatData(k){return CATS.find(c=>c.k===k)||CATS.find(c=>c.k==='other')},

  submitRecord(){
    const amt=parseFloat(document.getElementById('inputAmount').value);
    if(!amt||amt<=0){this.showToast('请输入金额');return}
    if(!this.curCat){this.showToast('请选择分类');return}
    const date=document.getElementById('inputDate').value;
    const note=document.getElementById('inputNote').value.trim();
    const records=this.getRecords();
    const ts=Date.now();

    if(this.editId!==null){
      const idx=records.findIndex(r=>r.id===this.editId);
      if(idx>=0){
        records[idx]={...records[idx],amt,cat:this.curCat,date,note,type:this.curType,mood:this.curMood};
        this.saveRecords(records);
        this.showToast('已更新 ✅');
      }
      this.editId=null;
      document.getElementById('btnSubmit').textContent='记一笔';
    }else{
      const record={id:'r_'+ts,amt,cat:this.curCat,date,note,type:this.curType,mood:this.curMood,time:new Date().toTimeString().slice(0,5),ts};
      records.push(record);
      this.saveRecords(records);
      this.showToast('记好了 ✓');
      this._celebrateAnim();
      // 情感化鼓励
      setTimeout(()=>{
        const quote=RECORD_QUOTES[Math.floor(Math.random()*RECORD_QUOTES.length)];
        const dayCount=this.getRecords().length;
        const text=quote.replace('{day}',dayCount);
        this.showToast(text);
      },400);
    }

    // Reset form
    this.savedAmounts[this.curType]='';
    document.getElementById('inputAmount').value='';
    document.getElementById('inputNote').value='';
    this.curCat=null;
    this.curMood=null;
    document.getElementById('inputDate').value=new Date().toISOString().slice(0,10);
    document.getElementById('recordBackfillBar').style.display='none';
    document.querySelectorAll('#moodSelector button').forEach(b=>b.classList.remove('active'));
    this.renderRecordPage();
    this.updateBudgetReminder();
    this.renderAchievements();
  },

  renderRecordPage(){
    this.renderCatGrid();
    this.renderQuickAmounts();
    document.querySelectorAll('.type-toggle button').forEach(b=>b.classList.remove('active'));
    document.querySelector('.type-toggle .'+this.curType).classList.add('active');
    document.getElementById('btnSubmit').textContent=this.editId!==null?'保存修改':'记一笔';

  // Edit mode
  enterEditMode(data){

    this.editId=data.id;
    // Switch page first to ensure DOM is ready
    this.switchPage('record');
    // Then set values on the now-visible DOM
    document.getElementById('inputAmount').value=data.amt;

    document.getElementById('inputDate').value=data.date;

    if(data.mood)this.setMood(data.mood);

  // ===== Bills Page =====
  renderBills(){
    const records=this.getRecords().sort((a,b)=>b.ts-a.ts);
    const search=document.getElementById('searchInput').value.toLowerCase().trim();
    const filterKey=this.filterKey;

    let filtered=records;
    // Search
    if(search){
      filtered=filtered.filter(r=>{
        const cat=this.getCatData(r.cat);
        return (cat.n+' '+r.note+' '+r.amt).toLowerCase().includes(search);
      });
    }
    // Filter
    if(filterKey==='today'){
      const today=new Date().toISOString().slice(0,10);
      filtered=filtered.filter(r=>r.date===today);
    }else if(filterKey==='week'){
      const now=new Date();
      const weekAgo=new Date(now.getFullYear(),now.getMonth(),now.getDate()-7);
      filtered=filtered.filter(r=>new Date(r.date)>=weekAgo);
    }else if(filterKey==='month'){
      const m=new Date().toISOString().slice(0,7);
      filtered=filtered.filter(r=>r.date.startsWith(m));
    }else if(filterKey!=='all'){
      filtered=filtered.filter(r=>r.cat===filterKey);
    }

    // Render filters
    const allCats=[...EC,...IC.filter(k=>!EC.includes(k))];
    const uniqueCats=[...new Set(allCats)];
    const ft=document.getElementById('filterTags');
    ft.innerHTML='<button class="filter-tag'+(filterKey==='all'?' active':'')+'" onclick="App.filterKey=\'all\';App.renderBills()">全部</button>'+
      '<button class="filter-tag'+(filterKey==='today'?' active':'')+'" onclick="App.filterKey=\'today\';App.renderBills()">今天</button>'+
      '<button class="filter-tag'+(filterKey==='week'?' active':'')+'" onclick="App.filterKey=\'week\';App.renderBills()">本周</button>'+
      '<button class="filter-tag'+(filterKey==='month'?' active':'')+'" onclick="App.filterKey=\'month\';App.renderBills()">本月</button>'+
      uniqueCats.map(k=>{const c=this.getCatData(k);return '<button class="filter-tag'+(filterKey===k?' active':'')+'" onclick="App.filterKey=\''+k+'\';App.renderBills()">'+c.i+' '+c.n+'</button>'}).join('');

    // Render list
    const list=document.getElementById('billList');
    const empty=document.getElementById('billEmpty');
    if(filtered.length===0){
      list.innerHTML='';
      empty.style.display='flex';
    }else{
      empty.style.display='none';
      list.innerHTML=filtered.map((r,idx)=>{
        const cat=this.getCatData(r.cat);
        const moodIcon=r.mood?MOODS[r.mood]:'';
        const delay=Math.min(idx*40,600);
        return '<div class="bill-item" style="animation-delay:'+delay+'ms" onclick="App.enterEditById(\''+r.id+'\')">'+
          '<div class="bill-emoji" style="background:'+cat.bg+'">'+cat.i+'</div>'+
          '<div class="bill-info"><div class="bill-cat">'+cat.n+'</div>'+
          '<div class="bill-meta"><span>'+r.date+'</span>'+(r.note?'<span>'+App.escapeHtml(r.note)+'</span>':'')+(moodIcon?'<span>'+moodIcon+'</span>':'')+'</div></div>'+
          '<div class="bill-amount '+(r.type==='expense'?'expense':'income')+'">'+(r.type==='expense'?'-':'+')+r.amt.toFixed(2)+'</div>'+
          '<div class="bill-actions" onclick="event.stopPropagation()">'+
          '<button onclick="App.enterEditById(\''+r.id+'\')" title="编辑">✏️</button>'+
          '<button onclick="App.deleteRecord(\''+r.id+'\')" title="删除">🗑️</button></div></div>';
      }).join('');
    }
    document.getElementById('recordCount').textContent=filtered.length+' 条';
  },
  _celebrateAnim(){
    const emojis=['✨','🎉','💰','⭐','💜','🌟'];
    const btn=document.querySelector('#btnSubmit');
    if(!btn)return;
    const rect=btn.getBoundingClientRect();
    for(let i=0;i<5;i++){
      const el=document.createElement('div');
      el.className='celebrate-particle';
      el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left=(rect.left+rect.width/2-10+Math.random()*40-20)+'px';
      el.style.top=rect.top+'px';
      el.style.animationDelay=(i*80)+'ms';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1200);
    }
  },
  escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML},
  deleteRecord(id){
    const records=this.getRecords();
    const idx=records.findIndex(r=>r.id===id);
    if(idx<0)return;
    const deleted=records.splice(idx,1)[0];
    this.saveRecords(records);
    this.renderBills();
    this.undoData=deleted;
    this.showToast('已删除','撤销',()=>{
      const rs=this.getRecords();
      rs.push(this.undoData);
      rs.sort((a,b)=>b.ts-a.ts);
      this.saveRecords(rs);
      this.renderBills();
      this.undoData=null;
    });
  },

  renderInsights(){
    const records=this.getRecords();
    const now=new Date();
    const thisMonth=now.toISOString().slice(0,7);
    const lastMonth=new Date(now.getFullYear(),now.getMonth()-1,1).toISOString().slice(0,7);
    const today=now.toISOString().slice(0,10);

    const monthRecords=records.filter(r=>r.date.startsWith(thisMonth)&&r.type==='expense');
    const lastMonthRecords=records.filter(r=>r.date.startsWith(lastMonth)&&r.type==='expense');
    const todayRecords=records.filter(r=>r.date===today&&r.type==='expense');

    const total=monthRecords.reduce((s,r)=>s+r.amt,0);
    const lastTotal=lastMonthRecords.reduce((s,r)=>s+r.amt,0);
    const catTotals={};
    monthRecords.forEach(r=>{catTotals[r.cat]=(catTotals[r.cat]||0)+r.amt});

    const insights=[];

    // Category warnings
    if(total>0){
      const foodPct=(catTotals['food']||0)/total;
      const shopPct=(catTotals['shopping']||0)/total;
      const entPct=(catTotals['entertain']||0)/total;
      const transPct=(catTotals['transport']||0)/total;

      if(foodPct>0.4)insights.push({icon:'🍜',text:'餐饮支出占比 '+(foodPct*100).toFixed(0)+'%，超过40%。建议减少外食，自己做饭更健康省钱。',cls:'warn'});
      if(shopPct>0.3)insights.push({icon:'🛍️',text:'购物支出占比 '+(shopPct*100).toFixed(0)+'%，超过30%。建议给自己设置"冷静期"，下单前等24小时。',cls:'danger'});
      if(entPct>0.2)insights.push({icon:'🎮',text:'娱乐支出占比 '+(entPct*100).toFixed(0)+'%，超过20%。试试免费的娱乐方式。',cls:'warn'});
      if(transPct>0.15)insights.push({icon:'🚌',text:'交通支出占比 '+(transPct*100).toFixed(0)+'%，超过15%。考虑公共交通出行。',cls:'info'});
    }

    // Monthly comparison
    if(lastTotal>0){
      const diff=total-lastTotal;
      const pct=((diff/lastTotal)*100).toFixed(0);
      if(diff>0)insights.push({icon:'📈',text:'本月支出较上月增长 '+pct+'%（+'+diff.toFixed(2)+'元），注意控制消费节奏。',cls:diff/lastTotal>0.2?'danger':'warn'});
      else if(diff<0)insights.push({icon:'📉',text:'本月支出较上月减少 '+Math.abs(diff).toFixed(2)+'元（'+pct+'%），继续保持！',cls:'good'});
    }

    // Today top 3
    if(todayRecords.length>0){
      const top3=[...todayRecords].sort((a,b)=>b.amt-a.amt).slice(0,3);
      insights.push({icon:'🔥',text:'今日消费TOP3：'+top3.map(r=>this.getCatData(r.cat).i+' ¥'+r.amt.toFixed(2)).join('、'),cls:'info'});
    }

    // Few records
    if(monthRecords.length<3){
      insights.push({icon:'📝',text:'本月记录较少（'+monthRecords.length+'条），多记几笔才能更好地分析消费习惯哦。',cls:'info'});
    }

    // Budget check
    const s=this.getSettings();
    if(s.budget>0&&total>s.budget){
      insights.push({icon:'⚠️',text:'本月已超预算！预算 ¥'+s.budget.toFixed(2)+'，已花 ¥'+total.toFixed(2)+'。',cls:'danger'});
    }

    // 预测性预算分析
    const budget=this.getSettings().budget;
    if(budget&&budget>0){
      const now=new Date();
      const daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
      const daysPassed=now.getDate();
      const daysLeft=daysInMonth-daysPassed;
      if(daysLeft>0&&total>0){
        const dailyAvg=total/daysPassed;
        const predicted=total+dailyAvg*daysLeft;
        const overBudget=predicted>budget;
        const safeAmount=budget-total;
        const dailyAllowance=safeAmount>0?(safeAmount/daysLeft).toFixed(0):0;
        if(overBudget){
          insights.push({icon:'⚠️',text:'按当前日均消费 ¥'+dailyAvg.toFixed(0)+'，预计月底总支出 ¥'+predicted.toFixed(0)+'，超预算 ¥'+(predicted-budget).toFixed(0)+'。建议接下来每天控制在 ¥'+dailyAllowance+' 以内',cls:'danger'});
        }else{
          insights.push({icon:'✅',text:'按当前速度月底约 ¥'+predicted.toFixed(0)+'，距预算还剩 ¥'+safeAmount.toFixed(0)+'。接下来每天可花 ¥'+dailyAllowance,cls:'good'});
        }
      }
    }

    const c=document.getElementById('insights');
    if(insights.length===0){
      c.innerHTML='<div class="insight-card info"><span class="insight-icon">💡</span><span class="insight-text">开始记几笔账，这里就会出现智能分析哦。</span></div>';
    }else{
      c.innerHTML=insights.map((i,idx)=>'<div class="insight-card '+i.cls+'" style="animation-delay:'+Math.min(idx*60,600)+'ms"><span class="insight-icon">'+i.icon+'</span><span class="insight-text">'+i.text+'</span></div>').join('');
    }
  },

  renderMonthCompare(){

    const now=new Date();
    const thisMonth=now.toISOString().slice(0,7);
    const lastMonth=new Date(now.getFullYear(),now.getMonth()-1,1).toISOString().slice(0,7);
    const total=records.filter(r=>r.date.startsWith(thisMonth)&&r.type==='expense').reduce((s,r)=>s+r.amt,0);

    }
  },

  renderPieChart(){
    try{
    const canvas=document.getElementById('pieChart');
    const legendEl=document.getElementById('pieLegend');
    const ctx=canvas.getContext('2d');
    const dpr=window.devicePixelRatio||1;
    const size=200;
    canvas.width=size*dpr;canvas.height=size*dpr;
    canvas.style.width=size+'px';canvas.style.height=size+'px';
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,size,size);

    const records=this.getRecords();
    const thisMonth=new Date().toISOString().slice(0,7);
    const monthRecords=records.filter(r=>r.date.startsWith(thisMonth)&&r.type==='expense');
    const catTotals={};
    monthRecords.forEach(r=>{catTotals[r.cat]=(catTotals[r.cat]||0)+r.amt});
    const total=monthRecords.reduce((s,r)=>s+r.amt,0);

    const cx=size/2,cy=size/2,r=75;
    const isDark=document.body.classList.contains('dk');

    if(total===0){
      ctx.fillStyle=isDark?'#636366':'#aeaeb2';
      ctx.font='14px -apple-system,PingFang SC,sans-serif';
      ctx.textAlign='center';
      ctx.fillText('本月暂无支出',cx,cy);
      legendEl.innerHTML='';
      return;
    }

    // Sort and merge small categories into "其他" (max 7)
    let entries=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
    let otherAmt=0;
    if(entries.length>7){
      const top=entries.slice(0,6);
      entries.slice(6).forEach(e=>otherAmt+=e[1]);
      entries=top.concat([['_other',otherAmt]]);
    }

    // Draw donut
    let startAngle=-Math.PI/2;
    entries.forEach(([k,amt])=>{
      const isOther=k==='_other';
      const color=isOther?(isDark?'#636366':'#c7c7cc'):(this.getCatData(k).c||'#999');
      const slice=amt/total*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,startAngle,startAngle+slice);
      ctx.closePath();
      ctx.fillStyle=color;
      ctx.fill();
      startAngle+=slice;
    });

    // Center hole
    ctx.beginPath();
    ctx.arc(cx,cy,40,0,Math.PI*2);
    ctx.fillStyle=isDark?'#1e1e1e':'#fff';
    ctx.fill();
    ctx.fillStyle=isDark?'#e8e8e8':'#1c1c1e';
    ctx.font='bold 16px -apple-system,PingFang SC,sans-serif';
    ctx.textAlign='center';
    ctx.fillText('¥'+total.toFixed(0),cx,cy-3);
    ctx.fillStyle=isDark?'#a0a0a0':'#86868b';
    ctx.font='10px -apple-system,PingFang SC,sans-serif';
    ctx.fillText('本月支出',cx,cy+12);

    // Render legend
    let legendHtml='';
    entries.forEach(([k,amt])=>{
      const isOther=k==='_other';
      const cat=isOther?{i:'📦',n:'其他',c:isDark?'#636366':'#c7c7cc'}:this.getCatData(k);
      const pct=(amt/total*100).toFixed(0);
      legendHtml+='<div class="pie-legend-item">';
      legendHtml+='<span class="pie-legend-dot" style="background:'+cat.c+'"></span>';
      legendHtml+='<span class="pie-legend-name">'+cat.i+' '+cat.n+'</span>';
      legendHtml+='<span class="pie-legend-pct">'+pct+'%</span>';
      legendHtml+='</div>';
    });
    legendEl.innerHTML=legendHtml;

    }catch(e){console.warn('pie chart error',e)}
  },

  renderCalendar(){
    const records=this.getRecords();
    const y=this.calYear,m=this.calMonth;
    // Normalize month
    while(m<0){m+=12;y--}
    while(m>11){m-=12;y++}
    this.calYear=y;this.calMonth=m;

    const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    document.getElementById('calTitle').textContent=y+'年 '+months[m];

    const firstDay=new Date(y,m,1).getDay();
    const daysInMonth=new Date(y,m+1,0).getDate();
    const today=new Date();
    const todayStr=today.toISOString().slice(0,10);
    const isCurrentMonth=(today.getFullYear()===y&&today.getMonth()===m);

    // Daily net amounts
    const dailyNet={};
    const dailyHas={};
    const prefix=y+'-'+String(m+1).padStart(2,'0')+'-';
    records.filter(r=>r.date.startsWith(prefix)).forEach(r=>{
      dailyHas[r.date]=true;
      if(!dailyNet[r.date])dailyNet[r.date]=0;
      dailyNet[r.date]+=r.type==='expense'?-r.amt:r.amt;
    });

    const allAmounts=Object.values(dailyNet).map(Math.abs);
    const maxAmt=allAmounts.length>0?Math.max(...allAmounts):0;

    let html='';
    for(let i=0;i<firstDay;i++)html+='<div class="calendar-cell empty"></div>';
    for(let d=1;d<=daysInMonth;d++){
      const dateStr=prefix+String(d).padStart(2,'0');
      const net=dailyNet[dateStr]||0;
      const hasData=dailyHas[dateStr];
      const isToday=isCurrentMonth&&d===today.getDate();
      let bg='';
      if(hasData&&maxAmt>0){
        const intensity=Math.abs(net)/maxAmt;
        if(net>0){
          bg='background:rgba(52,199,89,'+(0.1+intensity*0.25)+')';
        }else if(net<0){
          bg='background:rgba(99,102,241,'+(0.1+intensity*0.25)+')';
        }
      }
      let amtHtml='';
      if(net>0)amtHtml='<span class="cal-amt-inc">净赚+'+net.toFixed(0)+'</span>';
      else if(net<0)amtHtml='<span class="cal-amt-exp">-'+Math.abs(net).toFixed(0)+'</span>';
      html+='<div class="calendar-cell'+(isToday?' today':'')+'" style="'+bg+'" onclick="App.showDayDetail(\''+dateStr+'\')">'+
        '<span>'+d+'</span>'+(amtHtml?'<span class="cal-amt">'+amtHtml+'</span>':'')+'</div>';
    }
    document.getElementById('calendarGrid').innerHTML=html;
  },
  showDayDetail(dateStr){
    const today=new Date().toISOString().slice(0,10);
    const isFuture=dateStr>today;
    const isToday=dateStr===today;

    // 未来日期 → 文艺小toast
    if(isFuture){
      const futureQuotes=[
        '悟已往之不谏，知来者之可追 🍃',
        '未来的账，留给未来的自己 🌿',
        '明日复明日，明日何其多 ⏳',
        '来日方长，慢慢走 🌱',
      ];
      this.showToast(futureQuotes[Math.floor(Math.random()*futureQuotes.length)]);
      return;
    }

    // 今天和过去 → 大弹窗，可滚动、可修改、可补记
    const records=this.getRecords().filter(r=>r.date===dateStr);
    const totalExp=records.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amt,0);
    const totalInc=records.filter(r=>r.type==='income').reduce((s,r)=>s+r.amt,0);

    const weekday=['周日','周一','周二','周三','周四','周五','周六'];
    const parts=dateStr.split('-');
    const dateLabel=parts[0]+'年'+parseInt(parts[1])+'月'+parseInt(parts[2])+'日 '+weekday[new Date(dateStr).getDay()];

    let html='<div class="day-detail-modal">';
    html+='<div class="day-detail-header">';
    html+='<div style="font-size:18px;font-weight:700">'+dateLabel+'</div>';
    html+='<div class="day-detail-summary">';
    html+='<span style="color:var(--red)">支出 ¥'+totalExp.toFixed(2)+'</span>';
    html+='<span style="color:var(--green);margin-left:12px">收入 ¥'+totalInc.toFixed(2)+'</span>';
    if(totalExp>0||totalInc>0){
      const net=totalInc-totalExp;

  startBackfill(dateStr){

    else if(diff<=7)text='📅 补记 '+diff+' 天前的账';
    else if(diff<=30)text='📅 补记约 '+Math.floor(diff/7)+' 周前的账';

    document.getElementById('recordBackfillLabel').textContent=text;
    document.getElementById('recordBackfillBar').style.display='flex';

  renderTrendChart(){
    try{
    const canvas=document.getElementById('trendChart');
    const ctx=canvas.getContext('2d');
    const dpr=window.devicePixelRatio||1;
    const w=340,h=200;
    canvas.width=w*dpr;canvas.height=h*dpr;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,w,h);

    const records=this.getRecords();
    const now=new Date();
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      months.push(d.toISOString().slice(0,7));
    }

    const expData=[],incData=[];
    months.forEach(m=>{
      const mr=records.filter(r=>r.date.startsWith(m));
      expData.push(mr.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amt,0));
      incData.push(mr.filter(r=>r.type==='income').reduce((s,r)=>s+r.amt,0));
    });

    const allValues=[...expData,...incData];
    const maxVal=Math.max(...allValues,1);
    const pad={top:20,right:20,bottom:40,left:50};
    const pw=w-pad.left-pad.right,ph=h-pad.top-pad.bottom;

    const isDark=document.body.classList.contains('dk');

    // Grid
    ctx.strokeStyle=isDark?'#38383a':'#e5e5ea';
    ctx.lineWidth=0.5;
    for(let i=0;i<=4;i++){
      const y=pad.top+ph*(i/4);
      ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(w-pad.right,y);ctx.stroke();
      ctx.fillStyle=isDark?'#98989d':'#86868b';
      ctx.font='10px -apple-system,PingFang SC,sans-serif';
      ctx.textAlign='right';
      ctx.fillText('¥'+(maxVal*(1-i/4)).toFixed(0),pad.left-6,y+4);
    }

    // X labels
    const monthLabels=months.map(m=>{const p=m.split('-');return p[1]+'月'});
    ctx.fillStyle=isDark?'#98989d':'#86868b';
    ctx.font='11px -apple-system,PingFang SC,sans-serif';
    ctx.textAlign='center';
    monthLabels.forEach((l,i)=>{
      const x=pad.left+pw*i/(monthLabels.length-1);
      ctx.fillText(l,x,h-pad.bottom+16);
    });

    // Draw lines with area fill
    const drawLine=(data,color,fillColor)=>{
      // Area fill
      ctx.beginPath();
      data.forEach((v,i)=>{
        const x=pad.left+pw*i/(data.length-1);
        const y=pad.top+ph*(1-v/maxVal);
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      });
      ctx.lineTo(pad.left+pw,h-pad.bottom);
      ctx.lineTo(pad.left,h-pad.bottom);
      ctx.closePath();
      const grad=ctx.createLinearGradient(0,pad.top,0,h-pad.bottom);
      grad.addColorStop(0,fillColor);
      grad.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grad;
      ctx.fill();
      // Line
      ctx.strokeStyle=color;
      ctx.lineWidth=2.5;
      ctx.lineJoin='round';
      ctx.beginPath();
      data.forEach((v,i)=>{
        const x=pad.left+pw*i/(data.length-1);
        const y=pad.top+ph*(1-v/maxVal);
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      });
      ctx.stroke();
      // Dots
      data.forEach((v,i)=>{
        const x=pad.left+pw*i/(data.length-1);
        const y=pad.top+ph*(1-v/maxVal);
        ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);
        ctx.fillStyle=color;ctx.fill();
        ctx.strokeStyle=isDark?'#1e1e1e':'#fff';ctx.lineWidth=1.5;ctx.stroke();
      });
      // Last point value
      const lastV=data[data.length-1];
      if(lastV>0){
        const lx=pad.left+pw;
        const ly=pad.top+ph*(1-lastV/maxVal);
        ctx.fillStyle=isDark?'#e8e8e8':'#1c1c1e';
        ctx.font='bold 10px -apple-system,PingFang SC,sans-serif';
        ctx.textAlign='center';
        ctx.fillText('¥'+lastV.toFixed(0),lx,ly-10);
      }
    };

    drawLine(expData,'#ff3b30','rgba(255,59,48,0.1)');
    drawLine(incData,'#34c759','rgba(52,199,89,0.1)');

    // Legend
    ctx.fillStyle='#ff3b30';ctx.fillRect(pad.left,10,8,8);
    ctx.fillStyle=isDark?'#fff':'#1c1c1e';
    ctx.font='11px -apple-system,PingFang SC,sans-serif';
    ctx.textAlign='left';
    ctx.fillText('支出',pad.left+12,18);
    ctx.fillStyle='#34c759';ctx.fillRect(pad.left+60,10,8,8);
    ctx.fillText('收入',pad.left+72,18);

    // Summary
    const lastExp=expData[expData.length-1],prevExp=expData[expData.length-2]||0;
    const lastInc=incData[incData.length-1],prevInc=incData[incData.length-2]||0;
    let summary='';
    if(prevExp>0)summary+='支出'+(lastExp>prevExp?'增长':'下降')+Math.abs(((lastExp-prevExp)/prevExp*100).toFixed(0))+'%；';
    if(prevInc>0)summary+='收入'+(lastInc>prevInc?'增长':'下降')+Math.abs(((lastInc-prevInc)/prevInc*100).toFixed(0))+'%';
    document.getElementById('trendSummary').textContent=summary||'数据不足，无法生成趋势总结';
    }catch(e){console.warn('trend chart error',e)}
  },

  captureStatsImage(){
    const records=this.getRecords();
    if(records.length<3){this.showToast('至少需要3条记录');return}
    
    const canvas=document.createElement('canvas');
    const dpr=Math.min(window.devicePixelRatio||2,3);const w=375*dpr;const h=620*dpr;
    canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
    const W=375,H=560;
    
    // Background
    const grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#6366f1');grd.addColorStop(0.5,'#8b5cf6');grd.addColorStop(1,'#6366f1');
    ctx.fillStyle=grd;
    ctx.fillRect(0,0,W,H);
    
    // Decorative circles
    ctx.globalAlpha=0.06;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(320,60,80,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(50,H-40,60,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    
    // Title
    ctx.fillStyle='#fff';ctx.font='bold 22px -apple-system,PingFang SC,sans-serif';ctx.textAlign='center';
    ctx.fillText('碎银记 · 消费统计',W/2,50);
    ctx.font='13px -apple-system,PingFang SC,sans-serif';ctx.globalAlpha=0.7;
    ctx.fillText(new Date().getFullYear()+'年'+(new Date().getMonth()+1)+'月',W/2,72);
    ctx.globalAlpha=1;
    
    // Stats cards
    const thisMonth=new Date().toISOString().slice(0,7);
    const mr=records.filter(r=>r.date.startsWith(thisMonth));
    const expTotal=mr.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amt,0);
    const incTotal=mr.filter(r=>r.type==='income').reduce((s,r)=>s+r.amt,0);
    const avgDaily=expTotal/Math.max(1,new Date().getDate());
    
    const stats=[
      {label:'总支出',value:'¥'+expTotal.toFixed(0),color:'#ff6b6b'},
      {label:'总收入',value:'¥'+incTotal.toFixed(0),color:'#51cf66'},
      {label:'日均消费',value:'¥'+avgDaily.toFixed(0),color:'#ffd43b'},
      {label:'记录数',value:mr.length+' 笔',color:'#74c0fc'},
    ];
    const sw=(W-60)/2;
    stats.forEach((st,i)=>{
      const sx=20+i%2*(sw+10);
      const sy=95+Math.floor(i/2)*70;
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.beginPath();ctx.roundRect(sx,sy,sw,55,10);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='11px -apple-system,PingFang SC,sans-serif';ctx.textAlign='left';
      ctx.fillText(st.label,sx+12,sy+20);
      ctx.fillStyle=st.color;ctx.font='bold 20px -apple-system,PingFang SC,sans-serif';
      ctx.fillText(st.value,sx+12,sy+46);
    });
    
    // Category breakdown
    const catTotals={};
    mr.filter(r=>r.type==='expense').forEach(r=>{catTotals[r.cat]=(catTotals[r.cat]||0)+r.amt});
    const entries=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
    
    // 环比数据
    const lastMonth=new Date(new Date().getFullYear(),new Date().getMonth()-1,1).toISOString().slice(0,7);
    const lastExp=records.filter(r=>r.date.startsWith(lastMonth)&&r.type==='expense').reduce((s,r)=>s+r.amt,0);
    let trendText='',trendColor='rgba(255,255,255,0.5)';
    if(lastExp>0){
      const change=((expTotal-lastExp)/lastExp*100).toFixed(0);
      if(change>0){trendText='↑ '+change+'% vs 上月';trendColor='#ff9500'}
      else if(change<0){trendText='↓ '+Math.abs(change)+'% vs 上月';trendColor='#34c759'}
      else{trendText='— 与上月持平';}
    }
    if(trendText){
      ctx.fillStyle=trendColor;ctx.font='11px -apple-system,PingFang SC,sans-serif';ctx.textAlign='left';
      ctx.fillText(trendText,20,296);
    }
    ctx.fillStyle='#fff';ctx.font='bold 14px -apple-system,PingFang SC,sans-serif';ctx.textAlign='left';
    ctx.fillText('支出分类',20,312);
    
    const colors=['#ff9500','#007aff','#ff2d55','#af52de','#34c759','#ff3b30','#5856d6','#8e8e93'];
    entries.slice(0,5).forEach(([k,amt],i)=>{
      const cat=CATS.find(c=>c.k===k)||CATS[11];
      const pct=expTotal>0?(amt/expTotal*100):0;
      const y=330+i*46;

      // Label on top line
      ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='13px -apple-system,PingFang SC,sans-serif';ctx.textAlign='left';
      ctx.fillText(cat.i+' '+cat.n,20,y+14);
      // Amount on top line
      ctx.fillStyle='#fff';ctx.font='bold 13px -apple-system,PingFang SC,sans-serif';ctx.textAlign='right';
      ctx.fillText('¥'+amt.toFixed(0),W-20,y+14);
      // Percentage
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px -apple-system,PingFang SC,sans-serif';ctx.textAlign='right';
      ctx.fillText(pct.toFixed(0)+'%',W-20,y+30);
      // Bar below labels
      ctx.fillStyle='rgba(255,255,255,0.1)';
      ctx.beginPath();ctx.roundRect(20,y+36,W-40,6,3);ctx.fill();
      ctx.fillStyle=colors[i%colors.length];
      ctx.beginPath();ctx.roundRect(20,y+36,Math.max(6,(W-40)*pct/100),6,3);ctx.fill();
    });
    
    // Footer
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px -apple-system,PingFang SC,sans-serif';ctx.textAlign='center';
    ctx.fillText('碎银记 · 记好每一笔碎银 ✨',W/2,H-16);
    
    // Show in modal
    const dataUrl=canvas.toDataURL('image/png');
    const html='<h3>统计图表</h3><p style="font-size:12px;color:var(--t2);margin-bottom:8px">长按图片保存，或点击下方按钮</p>'+
      '<div style="text-align:center"><img src="'+dataUrl+'" style="width:100%;max-width:300px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.15)"></div>'+
      '<div style="display:flex;gap:8px;margin-top:12px">'+
      '<button class="btn-primary" style="flex:1" onclick="App._saveStatImage()">💾 保存到手机</button>'+
      '<button class="btn-primary" style="flex:1;background:var(--t2)" onclick="App.closeModal()">关闭</button></div>';
    window._statImageDataUrl=dataUrl;
    this.showModal(html,'sheet');
  },

  checkStreak(records){
    if(records.length===0)return 0;
    const dates=new Set(records.map(r=>r.date));
    const sorted=[...dates].sort().reverse();
    let streak=0;
    const today=new Date();
    for(let i=0;i<sorted.length;i++){
      const d=new Date(sorted[i]);
      const expected=new Date(today);
      expected.setDate(expected.getDate()-i);
      if(d.toISOString().slice(0,10)===expected.toISOString().slice(0,10))streak++;
      else break;
    }
    return streak;
  },
  checkBudgetStreak(records,settings){
    if(!settings.budget||settings.budget<=0)return 0;
    let streak=0;
    const now=new Date();
    for(let i=0;i<12;i++){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const m=d.toISOString().slice(0,7);
      const total=records.filter(r=>r.date.startsWith(m)&&r.type==='expense').reduce((s,r)=>s+r.amt,0);
      if(total<=settings.budget)streak++;else break;
    }
    return streak;
  },
  checkFullMonth(records){
    const now=new Date();
    const m=now.toISOString().slice(0,7);
    const daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    const monthDates=new Set(records.filter(r=>r.date.startsWith(m)).map(r=>r.date));
    for(let d=1;d<=Math.min(daysInMonth,now.getDate());d++){
      const ds=m+'-'+String(d).padStart(2,'0');
      if(!monthDates.has(ds))return false;
    }
    return monthDates.size>=daysInMonth;
  },
  checkNoRegret(records){
    const recent=records.slice(0,30);
    if(recent.length===0)return true;
    return !recent.some(r=>r.mood==='sad');
  },

  generateShareCard(){
    this.closeModal();
    const canvas=document.createElement('canvas');
    const cardDpr=Math.min(window.devicePixelRatio||2,3);
    canvas.width=600*cardDpr;canvas.height=900*cardDpr;
    const ctx=canvas.getContext('2d');
    ctx.scale(cardDpr,cardDpr);
    // Polyfill for roundRect
    const rrect=(x,y,w,h,r)=>{
      ctx.beginPath();
      ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
      ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
      ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
      ctx.closePath();
    };
    // Gradient bg
    const g=ctx.createLinearGradient(0,0,0,900);
    g.addColorStop(0,'#6366f1');g.addColorStop(1,'#8b5cf6');
    ctx.fillStyle=g;ctx.fillRect(0,0,600,900);
    // Card
    ctx.fillStyle='rgba(255,255,255,0.95)';
    rrect(40,40,520,820,20);ctx.fill();
    // Title
    ctx.fillStyle='#6366f1';ctx.font='bold 36px -apple-system,PingFang SC,sans-serif';ctx.textAlign='center';
    ctx.fillText('碎银记',300,110);
    ctx.fillStyle='#86868b';ctx.font='16px -apple-system,PingFang SC,sans-serif';
    ctx.fillText('每一笔都值得记录',300,140);
    // Month label
    const thisMonth=new Date().toISOString().slice(0,7);
    const parts=thisMonth.split('-');
    ctx.fillStyle='#aeaeb2';ctx.font='13px -apple-system,PingFang SC,sans-serif';
    ctx.fillText(parts[0]+'年'+parseInt(parts[1])+'月',300,168);

    // Stats cards
    const records=this.getRecords();
    const monthExp=records.filter(r=>r.date.startsWith(thisMonth)&&r.type==='expense').reduce((s,r)=>s+r.amt,0);
    const monthInc=records.filter(r=>r.date.startsWith(thisMonth)&&r.type==='income').reduce((s,r)=>s+r.amt,0);
    const streak=this.checkStreak(records);
    const items=[
      {label:'本月支出',value:'¥'+monthExp.toFixed(0),color:'#ff3b30'},
      {label:'本月收入',value:'¥'+monthInc.toFixed(0),color:'#34c759'},
    ];
    items.forEach((item,i)=>{
      const y=190+i*55;
      ctx.fillStyle='#f5f5f7';rrect(80,y,440,45,10);ctx.fill();
      ctx.fillStyle='#86868b';ctx.font='13px -apple-system,PingFang SC,sans-serif';ctx.textAlign='left';
      ctx.fillText(item.label,100,y+28);
      ctx.fillStyle=item.color;ctx.font='bold 22px -apple-system,PingFang SC,sans-serif';ctx.textAlign='right';
      ctx.fillText(item.value,500,y+30);
    });
    // Balance highlight
    const balance=monthInc-monthExp;
    ctx.fillStyle='#f0f0ff';rrect(80,305,440,40,10);ctx.fill();
    ctx.fillStyle=balance>=0?'#34c759':'#ff3b30';ctx.font='bold 18px -apple-system,PingFang SC,sans-serif';ctx.textAlign='center';
    ctx.fillText((balance>=0?'结余 +':'结余 ')+balance.toFixed(0)+' · 坚持'+streak+'天',300,332);

    // Top 3 categories
    const catTotals={};
    records.filter(r=>r.date.startsWith(thisMonth)&&r.type==='expense').forEach(r=>{catTotals[r.cat]=(catTotals[r.cat]||0)+r.amt});
    const topCats=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).slice(0,3);
    if(topCats.length>0){
      ctx.fillStyle='#6366f1';ctx.font='bold 15px -apple-system,PingFang SC,sans-serif';ctx.textAlign='left';
      ctx.fillText('支出 TOP 3',80,380);
      topCats.forEach(([k,amt],i)=>{
        const cat=this.getCatData(k);
        const pct=monthExp>0?(amt/monthExp*100).toFixed(0):'0';
        const y=398+i*44;
        ctx.fillStyle='rgba(99,102,241,0.08)';rrect(80,y,440,36,8);ctx.fill();
        ctx.fillStyle='#86868b';ctx.font='12px -apple-system,PingFang SC,sans-serif';ctx.textAlign='left';
        ctx.fillText(cat.i+' '+cat.n,96,y+22);
        ctx.fillStyle='#6366f1';ctx.font='bold 14px -apple-system,PingFang SC,sans-serif';ctx.textAlign='right';
        ctx.fillText('¥'+amt.toFixed(0)+'  '+pct+'%',508,y+22);
      });
    }

    // Fun insight
    ctx.fillStyle='#f5f5f7';rrect(80,540,440,70,12);ctx.fill();
    const dayNames=['周日','周一','周二','周三','周四','周五','周六'];
    const dayTotals={};
    records.filter(r=>r.date.startsWith(thisMonth)&&r.type==='expense').forEach(r=>{
      const d=new Date(r.date).getDay();
      dayTotals[d]=(dayTotals[d]||0)+r.amt;
    });
    const topDay=Object.entries(dayTotals).sort((a,b)=>b[1]-a[1])[0];
    let insight='认真记账的你，闪闪发光 ✨';
    if(topDay)insight=dayNames[parseInt(topDay[0])+'']+'花得最多，花了 ¥'+topDay[1].toFixed(0);
    ctx.fillStyle='#6366f1';ctx.font='13px -apple-system,PingFang SC,sans-serif';ctx.textAlign='center';
    ctx.fillText('💡 '+insight,300,570);
    // Encouragement based on data
    const encouragements=['每一笔记录都是对生活的认真','坚持记账的你，未来一定不会差','小钱攒大钱，滴水成江河','理财从记账开始，你已经走在路上了'];
    const enc=streak>=7?'坚持'+streak+'天，你比大多数人都自律':encouragements[Math.floor(Math.random()*encouragements.length)];
    ctx.fillStyle='#aeaeb2';ctx.font='11px -apple-system,PingFang SC,sans-serif';
    ctx.fillText(enc,300,590);
    ctx.fillStyle='#c7c7cc';ctx.font='10px -apple-system,PingFang SC,sans-serif';
    ctx.fillText('碎银记 · 一个高考生写的记账APP',300,608);

    // Footer
    ctx.fillStyle='#aeaeb2';ctx.font='13px -apple-system,PingFang SC,sans-serif';ctx.textAlign='center';
    ctx.fillText('扫码下载碎银记',300,810);
    // QR area placeholder
    // Will be replaced when user provides QR code
    // 展示卡片
    try{
      const dataUrl=canvas.toDataURL('image/png');
      const html='<h3>分享卡片</h3><p style="font-size:12px;color:var(--t2);margin-bottom:8px">长按图片保存，分享给朋友</p>'+
        '<div style="text-align:center"><img src="'+dataUrl+'" style="width:100%;max-width:300px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.15)"></div>'+
        '<div style="display:flex;gap:8px;margin-top:12px">'+
        '<button class="btn-primary" style="flex:1" onclick="App._saveCardFromCanvas()">💾 保存图片</button>'+
        '<button class="btn-primary" style="flex:1;background:var(--t2)" onclick="App.closeModal()">关闭</button></div>';
      window._cardDataUrl=dataUrl;
      this.showModal(html,'sheet');
    }catch(e){
      this.showToast('生成失败，请重试');
    }
  },
  _saveCardFromCanvas(){
    const dataUrl=window._cardDataUrl;
    if(!dataUrl){this.showToast('图片未生成');return}
    // dataUrl 格式: data:image/png;base64,xxxxx
    const b64=dataUrl.split(',')[1];
    if(b64 && this._nativeSave(b64,'碎银记分享卡片.png','image/png'))return;
    this.showToast('保存失败，请长按图片保存');
  },

  _nativeSave(base64Data, fileName, mimeType){
    try{
      if(window.Native && typeof Native.saveFile === 'function'){
        const result = Native.saveFile(base64Data, fileName, mimeType);
        if(result && typeof result === 'string' && !result.startsWith('ERROR')){
          this.showToast('已保存到下载目录 ✅');
          return true;
        }else{
          this.showToast('保存失败');
          return false;
        }
      }
    }catch(e){}
    return false;
  },
  _strToBase64(str){
    try{return btoa(unescape(encodeURIComponent(str)))}catch(e){return ''}
  },

  // ===== Export/Import =====
  exportData(format){
    const records=this.getRecords();
    if(records.length===0){this.showToast('暂无数据可导出');return}
    const fileName='碎银记_'+new Date().toISOString().slice(0,10)+'.csv';
    let csv='类型,金额,分类,日期,备注,心情\n';
    records.forEach(r=>{
      const cat=this.getCatData(r.cat);
      csv+=(r.type==='expense'?'支出':'收入')+','+r.amt.toFixed(2)+','+cat.n+','+r.date+','+(r.note||'')+','+(this.moodLabel(r.mood)||'')+'\n';
    });
    if(this._nativeSave(this._strToBase64('\uFEFF'+csv), fileName, 'text/csv'))return;
    this._showExportFallback(csv, fileName);
  },

  _doImportFile(){

      if(window.Native && typeof Native.openFilePicker==='function'){

  _onFileReady(){
    try{
      const b64=window._pendingFileBase64;
      if(!b64)return;
      // 解码 base64
      const binary=atob(b64);
      let content='';
      for(let i=0;i<binary.length;i++){
        content+=String.fromCharCode(binary.charCodeAt(i));
      }
      // 自动检测格式
      const trimmed=content.trim();
      if(trimmed.charAt(0)==='{'||trimmed.charAt(0)==='['){
        this._processJSONImport(trimmed);
      }else if(trimmed.indexOf(',')>-1 && trimmed.split('\n').length>1){
        this._processCSVImport(trimmed);
      }else{
        this.showToast('无法识别文件格式');
      }
    }catch(e){this.showToast('文件解析失败')}
  },
  _onFileError(msg){
    this.showToast(msg||'读取文件失败');
  },
  _processCSVImport(csvText){
    const lines=csvText.trim().split('\n');
    if(lines.length<2){this.showToast('文件为空');return}
    const records=[];
    let added=0;
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(',');
      if(cols.length<4)continue;
      const type=cols[0].trim()==='收入'?'income':'expense';
      const amt=parseFloat(cols[1]);
      if(isNaN(amt)||amt<=0)continue;
      const catName=cols[2].trim();
      const cat=CATS.find(c=>c.n===catName)||{k:'other'};
      const date=cols[3].trim()||new Date().toISOString().slice(0,10);
      const note=cols[4]||'';
      const mood=cols[5]||null;
      const moodMap={'值得':'happy','一般':'neutral','后悔':'sad','来之不易':'hard','意外之财':'surprise','小确幸':'lucky','平淡':'calm'};
      records.push({id:'r_'+Date.now()+'_'+i,amt,cat:cat.k,date,note,type,mood:moodMap[mood]||null,ts:Date.now()+i});
      added++;
    }
    if(added===0){this.showToast('未找到有效记录');return}
    const all=this.getRecords();
    records.forEach(r=>{all.push(r)});
    all.sort((a,b)=>b.ts-a.ts);
    this.saveRecords(all);
    this.showToast('成功导入 '+added+' 条记录 ✅');
    if(this.curPage==='bills')this.renderBills();
    else if(this.curPage==='stats')this.renderStats();
  },
  _processJSONImport(jsonStr){
    try{
      const data=JSON.parse(jsonStr);
      const items=data.records||data;
      if(!Array.isArray(items)){this.showToast('文件格式无效');return}
      const all=this.getRecords();
      const existingIds=new Set(all.map(r=>r.id));
      let added=0;
      items.forEach((r,i)=>{
        if(!existingIds.has(r.id)){
          all.push({id:r.id||'r_'+Date.now()+'_'+i,amt:r.amt,cat:r.cat||'other',date:r.date||new Date().toISOString().slice(0,10),note:r.note||'',type:r.type||'expense',mood:r.mood||null,ts:r.ts||Date.now()});
          added++;
        }
      });
      all.sort((a,b)=>b.ts-a.ts);
      this.saveRecords(all);
      this.showToast('成功导入 '+added+' 条记录 ✅');
      if(this.curPage==='bills')this.renderBills();
      else if(this.curPage==='stats')this.renderStats();
    }catch(e){this.showToast('JSON解析失败')}
  },

  parseTextImport(){
    const text=document.getElementById('importText').value.trim();
    if(!text){this.showToast('请粘贴文字');return}
    const lines=text.split(/[\n,，;；。]/);
    const results=[];
    lines.forEach(line=>{
      line=line.trim();if(!line)return;
      // Match amount
      const amtMatch=line.match(/([+-]?\d+(?:\.\d{1,2})?)\s*[元块]?/);
      if(!amtMatch)return;
      let amt=parseFloat(amtMatch[1]);
      let type='expense';
      if(amt<0||line.includes('收入')||line.includes('到账')||line.includes('工资')||line.includes('红包')||line.includes('退款')||line.includes('理财')){
        type='income';amt=Math.abs(amt);
      }
      // Guess category
      let cat='other';
      if(line.includes('餐')||line.includes('饭')||line.includes('食')||line.includes('外卖')||line.includes('奶茶')||line.includes('咖啡'))cat='food';
      else if(line.includes('车')||line.includes('交通')||line.includes('地铁')||line.includes('公交')||line.includes('打车')||line.includes('加油'))cat='transport';
      else if(line.includes('买')||line.includes('购')||line.includes('衣服')||line.includes('鞋')||line.includes('淘宝')||line.includes('京东'))cat='shopping';
      else if(line.includes('玩')||line.includes('游戏')||line.includes('电影')||line.includes('KTV')||line.includes('娱乐'))cat='entertain';
      else if(line.includes('房')||line.includes('租')||line.includes('水电')||line.includes('物业')||line.includes('居住'))cat='housing';
      else if(line.includes('药')||line.includes('医')||line.includes('看病')||line.includes('体检'))cat='medical';
      else if(line.includes('学')||line.includes('书')||line.includes('课')||line.includes('教育')||line.includes('培训'))cat='edu';
      else if(line.includes('工资')||line.includes('薪水')||line.includes('薪资'))cat='salary';
      else if(line.includes('红包')||line.includes('礼金'))cat='gift';
      else if(line.includes('理财')||line.includes('基金')||line.includes('股票')||line.includes('收益')||line.includes('利息'))cat='invest';
      else if(line.includes('退款')||line.includes('退')||line.includes('返还'))cat='refund';
      results.push({amt,type,cat,note:line.replace(amtMatch[0],'').trim()});
    });
    const preview=document.getElementById('importPreview');
    const btn=document.getElementById('btnImportAll');
    if(results.length===0){
      preview.innerHTML='<div style="text-align:center;color:var(--t3);padding:12px">未识别到有效记录</div>';
      btn.style.display='none';
    }else{
      preview.innerHTML=results.map((r,i)=>{
        const cat=this.getCatData(r.cat);
        return '<div class="ip-item"><div class="ip-check checked" onclick="this.classList.toggle(\'checked\')">✓</div>'+
          '<span>'+cat.i+' '+cat.n+'</span>'+
          '<span style="color:'+(r.type==='expense'?'var(--red)':'var(--green)')+'">'+(r.type==='expense'?'-':'+')+r.amt.toFixed(2)+'</span>'+
          '<span style="color:var(--t3);flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+App.escapeHtml(r.note)+'</span></div>';
      }).join('');
      btn.style.display='block';
      window._importResults=results;
    }
  },

  // ===== AI Report =====
  showAIReport(){
    const records=this.getRecords();
    if(records.length===0){this.showToast('暂无数据，先记几笔吧');return}
    const thisMonth=new Date().toISOString().slice(0,7);
    const lastMonth=new Date(new Date().getFullYear(),new Date().getMonth()-1,1).toISOString().slice(0,7);
    const monthRecords=records.filter(r=>r.date.startsWith(thisMonth));
    const lastMonthRecords=records.filter(r=>r.date.startsWith(lastMonth));
    const expTotal=monthRecords.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amt,0);
    const incTotal=monthRecords.filter(r=>r.type==='income').reduce((s,r)=>s+r.amt,0);
    const lastExpTotal=lastMonthRecords.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amt,0);
    const expRecords=monthRecords.filter(r=>r.type==='expense');

    // ===== 更智能的评分 =====
    let score=50;
    // 记账频率（15分）
    const totalRecords=records.length;
    const streak=this.checkStreak(records);
    score+=Math.min(Math.floor(totalRecords/5),15);
    // 连续记账（10分）
    if(streak>=30)score+=10;else if(streak>=7)score+=7;else if(streak>=3)score+=4;
    // 收支平衡（10分）
    if(incTotal>expTotal)score+=10;else if(expTotal>0&&incTotal/expTotal>=0.8)score+=5;
    // 预算控制（10分）
    const s=this.getSettings();
    if(s.budget>0){
      if(expTotal<=s.budget)score+=10;else if(expTotal<=s.budget*1.1)score+=4;
    }
    // 消费多样性（5分）
    const cats=new Set(expRecords.map(r=>r.cat));
    if(cats.size>=4)score+=5;else if(cats.size>=2)score+=2;
    score=Math.min(score,100);

    // ===== 恩格尔系数 =====
    const foodExp=expRecords.filter(r=>r.cat==='food').reduce((s,r)=>s+r.amt,0);
    const engel=expTotal>0?(foodExp/expTotal*100).toFixed(1):'0';
    const engelLevel=parseFloat(engel)>59?'💰 温饱':parseFloat(engel)>50?'🌿 小康':parseFloat(engel)>40?'✨ 富裕':'👑 极富裕';

    // ===== 分类排行 =====
    const catTotals={};
    expRecords.forEach(r=>{catTotals[r.cat]=(catTotals[r.cat]||0)+r.amt});
    const sortedCats=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);

    // ===== 环比变化 =====
    let momChange='';
    let momColor='var(--t2)';
    if(lastExpTotal>0){
      const change=((expTotal-lastExpTotal)/lastExpTotal*100).toFixed(0);
      if(change>0){momChange='↑ '+change+'%';momColor='var(--red)'}
      else if(change<0){momChange='↓ '+Math.abs(change)+'%';momColor='var(--green)'}
      else{momChange='持平';momColor='var(--green)'}
    }else{momChange='—';momColor='var(--t3)'}

    // ===== 个性化洞察（6条） =====
    const insights=[];
    // 餐饮洞察
    const foodPct=expTotal>0?(foodExp/expTotal*100).toFixed(0):0;

    // 购物洞察
    const shopAmt=catTotals['shopping']||0;
    if(shopAmt>0)insights.push({icon:'🛒',text:'本月购物花了 ¥'+shopAmt.toFixed(0)+(shopAmt>expTotal*0.3?'，有点多哦':''),type:shopAmt>expTotal*0.3?'warn':'info'});

      const ratio=incTotal/expTotal;
      if(ratio>=1.5)insights.push({icon:'💰',text:'收入是支出的 '+ratio.toFixed(1)+' 倍，超强的储蓄能力',type:'good'});
